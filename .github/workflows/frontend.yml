name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stellar-game/web... lint
      - run: pnpm --filter @stellar-game/web... build
