services:
  postgres:
    image: postgres:17-alpine
    container_name: sgw-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgw_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgw_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-stellar_wallet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sgw_dev} -d ${POSTGRES_DB:-stellar_wallet}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
